<form>
<div>
    <label for="name">Product Name:</label>
    <input id="name" name="prodname" [(ngModel)]="name"   type="text">
  </div>
  <div>
    <label for="category">Category:</label>
    <input id="category" name="category" [(ngModel)]="category"  type="text">
  </div>
  <div>
    <label for="price">Price:</label>
    <input id="price" name="price" [(ngModel)]="price"  type="number">
  </div>
  <div>
    <label for="qty">Quantity:</label>
    <input id="qty" name="quantity" [(ngModel)]="qty"  type="number">
  </div>

  <button (click)="submit()">Submit</button>
</form>
