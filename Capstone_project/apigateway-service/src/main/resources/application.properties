spring.application.name=api-gateway
server.port=9191

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# --- ROUTES ---
spring.cloud.gateway.routes[0].id=user-ms
spring.cloud.gateway.routes[0].uri=lb://user-ms
spring.cloud.gateway.routes[0].predicates[0]=Path=/user/**


spring.cloud.gateway.routes[1].id=product-ms
spring.cloud.gateway.routes[1].uri=lb://product-ms
spring.cloud.gateway.routes[1].predicates[0]=Path=/product/**

spring.cloud.gateway.routes[2].id=order-ms
spring.cloud.gateway.routes[2].uri=lb://order-ms
# IMPORTANT: Path predicate with BOTH patterns in ONE entry (comma-separated)
spring.cloud.gateway.routes[2].predicates[0]=Path=/order/**,/cart/**

spring.main.web-application-type=reactive

# --- CORS (dev) ---
spring.cloud.gateway.globalcors.cors-configurations[/**].allowedOriginPatterns=*
spring.cloud.gateway.globalcors.cors-configurations[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations[/**].allowCredentials=true
spring.cloud.gateway.globalcors.cors-configurations[/**].maxAge=3600
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true

# (optional) expose routes for debugging
management.endpoints.web.exposure.include=gateway

# --- Swagger UI in Gateway: list the upstream docs ---
springdoc.swagger-ui.urls[0].name=user-ms
springdoc.swagger-ui.urls[0].url=/user/v3/api-docs

springdoc.swagger-ui.urls[1].name=product-ms
springdoc.swagger-ui.urls[1].url=/product/v3/api-docs

springdoc.swagger-ui.urls[2].name=order-ms
springdoc.swagger-ui.urls[2].url=/order/v3/api-docs

# (optional) pick default in the dropdown when UI opens
springdoc.swagger-ui.urls-primary-name=user-ms

# --- Proxy Swagger/OpenAPI of each service via the gateway ---

spring.cloud.gateway.routes[3].id=user-ms-docs
spring.cloud.gateway.routes[3].uri=lb://user-ms
spring.cloud.gateway.routes[3].predicates[0]=Path=/user/v3/api-docs,/user/swagger-ui/**,/user/swagger-ui.html
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[4].id=product-ms-docs
spring.cloud.gateway.routes[4].uri=lb://product-ms
spring.cloud.gateway.routes[4].predicates[0]=Path=/product/v3/api-docs,/product/swagger-ui/**,/product/swagger-ui.html
spring.cloud.gateway.routes[4].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[5].id=order-ms-docs
spring.cloud.gateway.routes[5].uri=lb://order-ms
spring.cloud.gateway.routes[5].predicates[0]=Path=/order/v3/api-docs,/order/swagger-ui/**,/order/swagger-ui.html
spring.cloud.gateway.routes[5].filters[0]=StripPrefix=1

# One Swagger UI hosted by the gateway with links to each service's docs
springdoc.swagger-ui.urls[0].name=user-ms
springdoc.swagger-ui.urls[0].url=/user/v3/api-docs
springdoc.swagger-ui.urls[1].name=product-ms
springdoc.swagger-ui.urls[1].url=/product/v3/api-docs
springdoc.swagger-ui.urls[2].name=order-ms
springdoc.swagger-ui.urls[2].url=/order/v3/api-docs

springdoc.swagger-ui.urls-primary-name=user-ms


